<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logistics News — Logicard</title>
  <meta name="description" content="News, updates and stories from across UK logistics, warehousing, transport and freight — brought to you by Logicard." />
  <link rel="canonical" href="https://logicard.co.uk/logistics-news.html" />
  <link rel="icon" href="/favicon.svg?v=2" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/nav.css?v=5" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --orange: #FFB300; --orange-dark: #E09A00; --navy: #071d40; --navy-deep: #04040d;
      --navy-mid: #0d3b80; --white: #ffffff; --text-muted: #666666;
    }
    body { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; color: var(--white); background: var(--navy); }

    .page-hero { background: var(--navy); color: var(--white); padding: 64px 24px; text-align: center; }
    .page-hero h1 { font-size: clamp(28px, 4vw, 44px); font-weight: 900; margin-bottom: 12px; letter-spacing: -0.5px; }
    .page-hero p { color: rgba(255,255,255,0.7); max-width: 640px; margin: 0 auto; font-size: 16px; line-height: 1.6; }

    /* Gold band — alternates with the navy hero above and the navy
       bottom-cta below, matching the homepage's section-banding pattern.
       Headline cards flip to light/navy-text, same inverse-contrast
       convention used on every other gold band on the site. */
    .news-band { background: linear-gradient(135deg, #FF8C00 0%, #FFB800 55%, #FF9200 100%); padding: 56px 24px 72px; }
    .news-list { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .news-card {
      display: block; background: rgba(255,255,255,0.92); border: 1px solid rgba(7,29,64,0.1);
      border-radius: 14px; padding: 22px 24px; text-decoration: none; color: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .news-card:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(7,29,64,0.15); }
    .news-card-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; color: rgba(7,29,64,0.55); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.3px; }
    .news-card-meta .dot { opacity: 0.5; }
    .news-card h2 { font-size: 17px; font-weight: 800; color: var(--navy); line-height: 1.4; margin-bottom: 6px; }
    .news-card p { font-size: 13.5px; color: rgba(7,29,64,0.65); line-height: 1.55; }
    .news-empty { max-width: 560px; margin: 0 auto; text-align: center; background: rgba(255,255,255,0.9); border: 1px solid rgba(7,29,64,0.1); border-radius: 16px; padding: 40px 32px; }
    .news-empty h2 { color: var(--navy); font-size: 20px; font-weight: 900; margin-bottom: 10px; }
    .news-empty p { color: rgba(7,29,64,0.7); font-size: 14.5px; line-height: 1.6; }

    .bottom-cta { text-align: center; padding: 56px 24px 80px; }
    .cta-btn { display: inline-block; background: var(--orange); color: var(--navy); font-weight: 800; padding: 16px 40px; border-radius: 6px; text-decoration: none; }
    .cta-btn:hover { background: var(--orange-dark); }

    footer { text-align: center; padding: 28px 24px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 12.5px; color: rgba(255,255,255,0.5); }
    footer a { color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>

  <!-- SHARED_NAV -->

  <section class="page-hero">
    <h1>Logistics News</h1>
    <p>Headlines from across UK warehousing, transport, freight and supply chain — click through to read the full story at the source.</p>
  </section>

  <section class="news-band">
    <div class="news-list" id="newsList"></div>
  </section>

  <div class="bottom-cta">
    <a href="/signup.html" class="cta-btn">Join Logicard free →</a>
  </div>

  <footer>
    <p>© 2026 Logicard &nbsp;|&nbsp; <a href="/">Home</a> &nbsp;|&nbsp; <a href="/signup.html">Sign Up</a> &nbsp;|&nbsp; <a href="/login.html">Member Login</a></p>
  </footer>

  <script>
    (function () {
      var list = document.getElementById('newsList');

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function isSafeUrl(u) { return typeof u === 'string' && /^https:\/\//i.test(u); }
      function formatDate(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
      }

      fetch('/api/public/logistics-news')
        .then(function (r) { if (!r.ok) throw new Error('bad response'); return r.json(); })
        .then(function (items) {
          if (!Array.isArray(items) || items.length === 0) {
            list.innerHTML = '<div class="news-empty"><h2>No headlines yet</h2><p>We pull in fresh logistics news automatically every few hours — check back soon.</p></div>';
            return;
          }
          list.innerHTML = items.filter(function (n) { return isSafeUrl(n.link); }).map(function (n) {
            var date = formatDate(n.publishedAt);
            return (
              '<a class="news-card" href="' + esc(n.link) + '" target="_blank" rel="noopener noreferrer">' +
                '<div class="news-card-meta">' + esc(n.source) + (date ? '<span class="dot">&bull;</span>' + esc(date) : '') + '</div>' +
                '<h2>' + esc(n.title) + '</h2>' +
                (n.summary ? '<p>' + esc(n.summary) + '</p>' : '') +
              '</a>'
            );
          }).join('');
        })
        .catch(function () {
          list.innerHTML = '<div class="news-empty"><h2>No headlines yet</h2><p>We pull in fresh logistics news automatically every few hours — check back soon.</p></div>';
        });
    })();
  </script>

</body>
</html>
